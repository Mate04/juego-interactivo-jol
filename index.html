;font-weight:600;color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}\n.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}\n.btn-ghost .ic{width:18px;height:18px}\n/* map */\n.map{padding:18px 32px 4px}\n.map-ol{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));max-width:1120px}\n.map-li{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:14px;font-weight:600;color:var(--muted)}\n.map-li::before{content:\"\";position:absolute;top:15px;right:50%;width:100%;height:3px;background:var(--line);z-index:0}\n.map-li:first-child::before{display:none}\n.m-dot{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--muted);transition:all .4s}\n.map-li.done .m-dot{background:var(--blue);border-color:var(--blue);color:#fff}\n.map-li.done::before,.map-li.cur::before{background:var(--blue)}\n.map-li.cur{color:var(--navy)}\n.map-li.cur .m-dot{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 0 0 6px var(--orange-s)}\n.map-li.skip{color:#7D8EA8}\n.map-li.skip .m-dot{border-style:dashed;color:#7D8EA8}\n.map-li.skip .m-lbl::after{content:\" · no aplica\";font-weight:500}\n/* stage */\n.stage{flex:1;display:flex;justify-content:center;padding:20px 32px 28px}\n.stage-in{width:100%;max-width:1240px;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 50px -28px rgba(11,42,91,.35);padding:clamp(24px,4vw,56px);display:flex;flex-direction:column;justify-content:center;min-height:560px}\n.scene{animation:sceneIn .6s ease both}\n.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,64px);align-items:center}\n.eyebro , custom: false, forming: false, choice: null, solved: false, added: false, phone: 'idle', syncDone: false, rm: false, dark: true, again: false };\n\nclass Component extends DCLogic {\n  get S() { return Object.assign({}, DEF, this.state || {}); }\n  componentDidMount() {\n    try { this._pv = Object.keys(CASE_IMAGES).filter(function (k) { return CASE_IMAGES[k]; }).map(function (k) { var im = new Image(); im.src = CASE_IMAGES[k]; return im; }); } catch (e) {}\n    \n    try { this._okp = Object.keys(PHONE_OK_IMAGES).map(function (k) { var im = new Image(); im.src = PHONE_OK_IMAGES[k]; return im; }); } catch (e) {}\n    try { if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) this.setState({ rm: true }); } catch (e) {}\n  }\n  componentWillUnmount() { this.clearT(); }\n  clearT() { (this._t || []).forEach(function (t) { clearTimeout(t); }); this._t = []; }\n  later(fn, ms) { if (!this._t) this._t = []; if (!ms) { fn(); return; } this._t.push(setTimeout(fn, ms)); }\n  go(patch) { this.clearT(); this.setState(patch); }\n  reset(extra) {\n    return Object.assign({ choice: null, solved: false, added: false, phone: 'idle', syncDone: false, forming: false }, extra);\n  }\n  start() {\n    var s = this.S;\n    if (s.forming) return;\n    this.go(this.reset({ label: CASES[s.caseId].url, custom: false, forming: true }));\n    var self = this;\n    this.later(function () { self.setState({ forming: false, scene: 'registry' }); }, s.rm ? 0 : 1100);\n  }\n  renderVals() {\n    var s = this.S, self = this;\n    var cs = CASES[s.caseId];\n    var scene = s.scene;\n    var isIllegal = cs.kind === 'ilegal';\n    var cur = STAGE_OF[scene];\n    var skip = !isIllegal && cur >= 3;\n    var stages = STAGES.map(function (l, i) {\n      var cls = 'map-li';\n      if (skip && i === 4) cls += ' skip';\n      else if (i < cur) cls += ' done';\n      else if (i === cur) cls += ' cur';\n      return { n: i + 1, label: l, cls: cls, current: i === cur ? 'step el || cs.url) + ' a la oficina de revisión',\n      hasImg: !!CASE_IMAGES[s.caseId], noImg: !CASE_IMAGES[s.caseId], imgSrc: CASE_IMAGES[s.caseId] || '',\n      imgAlt: 'Vista previa del sitio ficticio ' + cs.url,\n      cs: cs, opts: opts, feedback: fbText, fbWrong: !!s.choice && !s.solved, solved: s.solved,\n      isIllegal: isIllegal, notIllegal: !isIllegal, okReason: cs.reason || '',\n      status: status, badgeCls: 'badge ' + badge,\n      pathTop: isIllegal ? 'fp on-ill' : 'fp', pathBot: isIllegal ? 'fp' : 'fp on-ok',\n      lblTop: isIllegal ? 'fk-lbl top act-ill' : 'fk-lbl top', lblBot: isIllegal ? 'fk-lbl bot' : 'fk-lbl bot act-ok',\n      forkCard: isIllegal ? 'fork-card up' : 'fork-card down',\n      added: s.added, notAdded: !s.added,\n      syncChip: s.syncDone ? 'p-chip ok' : 'p-chip wait', syncText: s.syncDone ? 'Actualizada' : 'Recibiendo información…',\n      phIdle: s.phone === 'idle', phLoading: s.phone === 'loading', phBlocked: s.phone === 'blocked', phAllowed: s.phone === 'allowed',\n      okImgCls: s.phone === 'allowed' ? 'bl-img show' : 'bl-img', okImgHidden: s.phone === 'allowed' ? 'false' : 'true',\n      okImgSrc: PHONE_OK_IMAGES[s.caseId] || '', okImgAlt: 'Sitio ' + cs.url + ' abierto en el celular',\n      endTitle: isIllegal ? 'Detrás de cada bloqueo hay un proceso de revisión' : 'Detrás de cada decisión hay un proceso de revisión',\n      endLead: isIllegal ? 'Recorriste el camino desde el reporte de un sitio hasta la protección en el dispositivo.' : 'Recorriste el camino de un sitio que fue revisado y no se bloqueó: NoVa+ solo bloquea los sitios identificados como ilegales.',\n      chClas: isIllegal ? 'Se valida como ilegal' : 'No es de apuestas',\n      chBase: isIllegal ? 'Se suma al listado' : 'No se incorpora',\n      chBaseCls: isIllegal ? 'ch-node' : 'ch-node off',\n      chNova: isIllegal ? 'Aplica la protección' : 'Permite el acceso',\n      endBadge: isIllegal ? 'Bloqueado mediante NoVa+' : 'Acceso permitido',\n      endBadgeCls: isIllegal ? 'badge b-block' : 'badge b-ok',\n      blImgCls: s.phone === 'blocked' ? 'bl-img show' : 'bl-img', blImgHidden: s.phone === 'blocked' ? 'false' : 'true',\n      begin: function () { self.start(); },\n      sendToOffice: function () { self.go({ scene: 'office' }); },\n      openReview: function () { self.go({ scene: 'review' }); },\n      toDecision: function () { self.go({ scene: 'decision' }); },\n      toBase: function () { self.go({ scene: 'base' }); },\n      incorporate: function () { self.setState({ added: true }); },\n      toSync: function () {\n        self.go({ scene: 'sync', syncDone: false });\n        self.later(function () { self.setState({ syncDone: true }); }, self.S.rm ? 0 : 2200);\n      },\n      toPhone: function () { self.go({ scene: 'phone', phone: 'idle' }); },\n      enter: function () {\n        self.go({ phone: 'loading' });\n        var res = CASES[self.S.caseId].kind === 'ilegal' ? 'blocked' : 'allowed';\n        self.later(function () { self.setState({ phone: res }); }, 1500);\n      },\n      toEnd: function () { self.go({ scene: 'end' }); },\n      tryAnother: function () {\n        var next = ORDER[(ORDER.indexOf(self.S.caseId) + 1) % ORDER.length];\n        self.go(self.reset({ scene: 'start', again: true, url: '', label: '', custom: false, caseId: next }));\n      },\n      restart: function () { self.go(self.reset({ scene: 'start', again: false, url: '', label: '', custom: false, caseId: 'ilegal' })); },\n      toggleMotion: function () { self.setState({ rm: !self.S.rm }); },\n      toggleDark: function () { self.setState({ dark: !self.S.dark }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<script>/* fit-to-viewport */\n(function(){\n  var MIN=0.45, busy=false, timer=null;\n  function q(sel,root){return (root||document).querySelector(sel);}\n  function apply(app,k){\n    app.style.transformOrigin=\"0 0\";\n    app.style.transform=(k===1?\"none\":\"scale(\"+k+\")\");\n    app.style.width=(window.innerWidth/k)+\"px\";\n    app.style.height=(window.innerHeight/k)+\"px\";\n  }\n  function fits(app,stage){\n    var inn=q(\".stage-in\",stage);\n    if(!inn) return true;\n    var cs=getComputedStyle(stage);\n    var avail=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);\n    var availW=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);\n    return inn.offsetHeight<=avail+1 && inn.scrollWidth<=availW+1 && app.scrollWidth<=app.clientWidth+1;\n  }\n  function fit(){\n    var app=q(\".app\"), stage=app&&q(\".stage\",app);\n    if(!app||!stage) return;\n    busy=true;\n    stage.classList.add(\"fit-measure\");\n    apply(app,1);\n    if(!fits(app,stage)){\n      var lo=MIN, hi=1;\n      apply(app,lo);\n      if(fits(app,stage)){\n        for(var i=0;i<9;i++){\n          var mid=(lo+hi)/2;\n          apply(app,mid);\n          if(fits(app,stage)) lo=mid; else hi=mid;\n        }\n      }\n      apply(app,lo);\n    }\n    stage.classList.remove(\"fit-measure\");\n    busy=false;\n    if(mo) mo.takeRecords();\n  }\n  function schedule(){\n    if(busy) return;\n    clearTimeout(timer);\n    timer=setTimeout(function(){requestAnimationFrame(fit);},60);\n  }\n  var mo=new MutationObserver(schedule);\n  function start(){\n    mo.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:[\"class\",\"hidden\"]});\n    window.addEventListener(\"resize\",schedule);\n    window.addEventListener(\"orientationchange\",schedule);\n    window.addEventListener(\"load\",schedule);\n    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(schedule);\n    document.addEventListener(\"transitionend\",schedule);\n    document.addEventListener(\"animationend\",schedule);\n    schedule();\n  }\n  if(document.body) start(); else document.addEventListener(\"DOMContentLoaded\",start);\n})();\n<\u002Fscript><\u002Fbody><\u002Fhtml>"
